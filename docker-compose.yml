version: '3.8'

services:
  # Service 1: PostgreSQL database with pgvector extension pre-installed
  db:
    image: pgvector/pgvector:pg16
    container_name: coderag-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coderag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coderag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: FastAPI Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: coderag-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/coderag
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  # Service 3: React Frontend (Nginx Production Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coderag-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
